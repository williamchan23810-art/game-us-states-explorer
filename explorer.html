// Helper to shuffle choices
const shuffle = <T,>(array: T[]): T[] => {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

function App() {
  const [game, setGame] = React.useState(initialGameState);
  const [activeTab, setActiveTab] = React.useState('facts');
  const [enlargedImage, setEnlargedImage] = React.useState(null);

  // Active state data lookup
  const activeState = React.useMemo(() => {
    if (!game.selectedStateId) return null;
    return statesData.find(s => s.id === game.selectedStateId) || null;
  }, [game.selectedStateId]);

  // Active state facts lookup
  const activeFacts = React.useMemo(() => {
    if (!activeState) return null;
    return statesFactsData.find(f => f.state.toLowerCase() === activeState.name.toLowerCase()) || null;
  }, [activeState]);

  // Click on a state on the map
  const handleStateClick = (stateId: string) => {
    const state = statesData.find(s => s.id === stateId);
    if (!state) return;

    // Reset current quiz attempt for the clicked state and reset active tab to facts
    setActiveTab('facts');
    setEnlargedImage(null);
    setGame(prev => ({
      ...prev,
      selectedStateId: stateId,
      currentMode: null,
      quizStep: 'mode-select',
      selectedAnswer: null,
      firstQuestionPassed: null,
      lastFeedback: null,
    }));
  };

  // Start the quiz for the selected state
  const startQuiz = (mode: QuizMode) => {
    if (!activeState) return;

    // Build choices
    const capChoices = shuffle([
      activeState.capitol,
      activeState.topCities[0] || 'Major City A',
      activeState.topCities[1] || 'Major City B'
]);

    const uniChoices = shuffle([
      activeState.inStateUniversities[0] || 'State Univ 1',
      activeState.inStateUniversities[1] || 'State Univ 2',
      activeState.outOfStateDistractor.name
]);

    let fChoices = [];
    let fQuestionText = '';
    let fCorrectAnswer = '';
    let fCategory = '';

    let flChoices = [];
    let flCorrectAnswer = '';
    let flIsSeal = false;

    let targetStep = 'mode-select';

    if (mode === 'facts') {
      targetStep = 'question-facts';
      if (activeFacts) {
        // Pick a random valid category that isn't "None"
        const possibleCategories = ['nickname', 'bird', 'flower', 'tree', 'animal', 'rock', 'song'];
        const validCategories = possibleCategories.filter(cat => {
          const val = activeFacts[cat];
          if (typeof val === 'string') {
            return val.toLowerCase() !== 'none' && !val.toLowerCase().startsWith('none');
          }
          return false;
        });

        const chosenCategory = validCategories.length > 0 
          ? validCategories[Math.floor(Math.random() * validCategories.length)]
          : 'nickname';

        fCategory = chosenCategory;
        fCorrectAnswer = activeFacts[chosenCategory];

        const questionTemplates = {
          nickname: `What is the official nickname of the state of ${activeState.name}?`,
          bird: `Which of these is the official state bird of ${activeState.name}?`,
          flower: `What is the official state flower of ${activeState.name}?`,
          tree: `What is the official state tree of ${activeState.name}?`,
          animal: `What is the official state animal of ${activeState.name}?`,
          rock: `What is the official state rock of ${activeState.name}?`,
          song: `Which of these is the official state song of ${activeState.name}?`
        };
        fQuestionText = questionTemplates[chosenCategory] || `What is the official ${chosenCategory} of ${activeState.name}?`;

        const otherStates = statesFactsData.filter(f => f.state !== activeState.name);
        const distractorPool = otherStates
          .map(f => f[chosenCategory])
          .filter(val => val && val.toLowerCase() !== 'none' && !val.toLowerCase().startsWith('none') && val !== fCorrectAnswer);
        const uniqueDistractors = Array.from(new Set(distractorPool));
        const selectedDistractors = shuffle(uniqueDistractors).slice(0, 2);

        fChoices = shuffle([fCorrectAnswer, ...selectedDistractors]);
      }
    } else if (mode === 'flag') {
      targetStep = 'question-flag';
      flIsSeal = false;
      flCorrectAnswer = activeState.name;

      const otherNames = statesFactsData.filter(f => f.state !== activeState.name).map(f => f.state);
      const selectedDistractors = shuffle(otherNames).slice(0, 2);

      flChoices = shuffle([flCorrectAnswer, ...selectedDistractors]);
    } else {
      targetStep = mode === 'university' ? 'question-2' : 'question-1';
    }

    setGame(prev => ({
      ...prev,
      currentMode: mode,
      capitolChoices: capChoices,
      universityChoices: uniChoices,
      factsChoices: fChoices,
      factsQuestionText: fQuestionText,
      factsCorrectAnswer: fCorrectAnswer,
      factsCategory: fCategory,
      flagChoices: flChoices,
      flagCorrectAnswer: flCorrectAnswer,
      flagIsSeal: flIsSeal,
      selectedAnswer: null,
      firstQuestionPassed: null,
      lastFeedback: null,
      quizStep: targetStep,
    }));
  };

  // Submit answer for Capitol Quiz (Question 1)
  const submitCapitolAnswer = (answer: string) => {
    if (!activeState) return;

    const isCorrect = answer === activeState.capitol;
    const citiesStr = activeState.topCities.slice(0, 2).join(' and ');
    
    const feedback = {
      isCorrect,
      message: isCorrect ? 'Correct!' : 'Incorrect!',
      details: isCorrect
        ? `${activeState.capitol} is indeed the official capitol of ${activeState.name}, even though cities like ${citiesStr} are larger!`
        : `Nice try! The official capitol of ${activeState.name} is ${activeState.capitol}. ${answer} is a major city in the state but not the capitol.`
    };

    if (game.currentMode === 'both') {
      // In both mode, record first question result temporarily and proceed to question 2
      setGame(prev => ({
        ...prev,
        firstQuestionPassed: isCorrect,
        selectedAnswer: null,
        lastFeedback: feedback,
        quizStep: 'question-2',
      }));
    } else {
      // Single quiz mode end
      updateEndState(isCorrect, feedback);
    }
  };

  // Submit answer for University Quiz (Question 2)
  const submitUniversityAnswer = (answer: string) => {
    if (!activeState) return;

    const isCorrect = answer === activeState.outOfStateDistractor.name;
    const feedback = {
      isCorrect,
      message: isCorrect ? 'Correct!' : 'Incorrect!',
      details: isCorrect
        ? `Great job! ${answer} is located in ${activeState.outOfStateDistractor.state}, while the others are in ${activeState.name}.`
        : `Oops! ${answer} is located in ${activeState.name}, but ${activeState.outOfStateDistractor.name} is actually out-of-state in ${activeState.outOfStateDistractor.state}.`
    };

    if (game.currentMode === 'both') {
      // Combined quiz ends
      const bothCorrect = (game.firstQuestionPassed === true) && isCorrect;
      
      const combinedFeedback = {
        isCorrect: bothCorrect,
        message: bothCorrect ? 'Outstanding! Both Correct!' : 'Quiz Complete!',
        details: `${game.lastFeedback?.details} Additionally, ${feedback.details}`
      };
      
      updateEndState(bothCorrect, combinedFeedback);
    } else {
      // Single quiz mode end
      updateEndState(isCorrect, feedback);
    }
  };

  // Submit answer for Facts Quiz
  const submitFactsAnswer = (answer: string) => {
    if (!activeState) return;

    const isCorrect = answer === game.factsCorrectAnswer;
    const categoryName = game.factsCategory.charAt(0).toUpperCase() + game.factsCategory.slice(1);
    
    const feedback = {
      isCorrect,
      message: isCorrect ? 'Correct!' : 'Incorrect!',
      details: isCorrect
        ? `Great job! "${game.factsCorrectAnswer}" is indeed the official ${categoryName} of ${activeState.name}.`
        : `Oops! The official ${categoryName} of ${activeState.name} is actually "${game.factsCorrectAnswer}".`
    };

    updateEndState(isCorrect, feedback);
  };

  // Submit answer for Flag/Seal Quiz
  const submitFlagAnswer = (answer: string) => {
    if (!activeState) return;

    const isCorrect = answer === game.flagCorrectAnswer;
    
    const feedback = {
      isCorrect,
      message: isCorrect ? 'Correct!' : 'Incorrect!',
      details: isCorrect
        ? `Excellent! This is indeed the official state flag of ${activeState.name}.`
        : `Not quite! This is actually the official state flag of ${game.flagCorrectAnswer}.`
    };

    updateEndState(isCorrect, feedback);
  };

  // Finalize quiz step and record scores
  const updateEndState = (
    isCorrect: boolean, 
    feedback: { isCorrect: boolean; message: string; details: string }
  ) => {
    if (!game.selectedStateId) return;

    setGame(prev => { 
      const stateId = prev.selectedStateId;
      const currentStatus = prev.stateStatus[stateId];
      
      // Only count score if they haven't answered this state correctly already, or standard increment
      const newStatus = isCorrect ? 'correct' : 'wrong';
      
      // If it was already answered correct, don't double count score
      const alreadyCorrect = currentStatus === 'correct';
      
      return {
        ...prev,
        score: {
          correct: prev.score.correct + (isCorrect && !alreadyCorrect ? 1 : 0),
          total: prev.score.total + (!alreadyCorrect ? 1 : 0)
        },
        stateStatus: {
          ...prev.stateStatus,
          [stateId]: newStatus
        },
        lastFeedback: feedback,
        quizStep: 'feedback'
      };
     });
  };

  // Reset the full game
  const resetGame = () => {
    setGame(initialGameState);
  };

  // Count progress
  const answeredCount = Object.keys(game.stateStatus).length;
  const correctCount = Object.values(game.stateStatus).filter(s => s === 'correct').length;

  return (
    <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 selection:bg-teal-500/30">
      
      {/* Header Bar */}
      <header className="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md px-6 py-4 sticky top-0 z-10 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <img 
            src="logo.jpg" 
            alt="William H. Chan Educational Games" 
            className="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded-xl border border-teal-500/30 shadow-lg shadow-teal-500/5 animate-pulse"
            style={{ animationDuration: '4s' }}
          />
          <div>
            <h1 className="text-xl font-bold tracking-tight bg-gradient-to-r from-teal-400 to-emerald-400 bg-clip-text text-transparent">
              US States Explorer & Quiz
            </h1>
            <p className="text-xs text-slate-400">Interactive Geography & Academics Guide</p>
          </div>
        </div>

        <div className="flex items-center gap-6">
          {/* Progress stats */}
          <div className="hidden md:flex gap-4">
            <div className="bg-slate-800/40 border border-slate-700/50 px-3 py-1.5 rounded-lg text-center">
              <span className="text-xs text-slate-400 block uppercase tracking-wider font-semibold">States Visited</span>
              <span className="text-sm font-bold text-teal-400">{answeredCount} / 50</span>
            </div>
            <div className="bg-slate-800/40 border border-slate-700/50 px-3 py-1.5 rounded-lg text-center">
              <span className="text-xs text-slate-400 block uppercase tracking-wider font-semibold">Quiz Score</span>

                          </div>
                        </div>

                        <div className="flex flex-col gap-2.5">
                          {game.flagChoices.map((choice) => (
                            <button
                              key={choice}
                              onClick={() => submitFlagAnswer(choice)}
                              className="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 active:bg-slate-650 rounded-xl border border-slate-700 text-left text-sm font-semibold hover:text-white transition-all"
                            >
                              {choice}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Step 4: Feedback Display */}
                    {game.quizStep === 'feedback' && game.lastFeedback && (
                      <div className="flex-1 flex flex-col gap-5 justify-between animate-fadeIn">
                        <div className="flex flex-col gap-4">
                          <div className="flex justify-center">
                            {game.lastFeedback.isCorrect ? (
                              <div className="bg-emerald-500/10 p-4 rounded-full border border-emerald-500/30 text-emerald-400 flex items-center justify-center">
                                <CheckCircle2Icon className="w-12 h-12 animate-bounce" />
                              </div>
                            ) : (
                              <div className="bg-rose-500/10 p-4 rounded-full border border-rose-500/30 text-rose-400 flex items-center justify-center">
                                <XCircleIcon className="w-12 h-12 animate-bounce" />
                              </div>
                            )}
                          </div>

                          <div className="text-center">
                            <h4 className={`text-xl font-bold ${game.lastFeedback.isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                              {game.lastFeedback.message}
                            </h4>
                            <p className="text-sm text-slate-300 mt-3 leading-relaxed px-2">
                              {game.lastFeedback.details}
                            </p>
                          </div>
                        </div>

                        <button
                          onClick={() => setGame(prev => ({ ...prev, quizStep: 'mode-select', lastFeedback: null }))}
                          className="w-full py-3 bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white rounded-xl font-bold transition-all shadow-lg hover:shadow-teal-500/15"
                        >
                          Choose Another Quiz
                        </button>
                      </div>
                    )}
                  </div>
                )}

              </div>
            ) : (
              /* Initial Instruction State */
              <div className="flex-1 flex flex-col items-center justify-center text-center gap-4 py-12 px-4">
                <div className="bg-slate-800/40 p-4 rounded-full border border-slate-800 text-slate-400">
                  <CompassIcon className="w-10 h-10 animate-spin" />
                </div>
                <div>
                  <h4 className="font-bold text-slate-200">No State Selected</h4>
                  <p className="text-xs text-slate-400 mt-2 max-w-[240px] mx-auto leading-relaxed">
                    Choose a state on the interactive map to review its details and take the quiz options!
                  </p>
                </div>
              </div>
            )}
          </div>

          {/* Sidebar Footer Stats */}
          <div className="bg-slate-900/60 p-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
            <span className="flex items-center gap-1.5">
              <AwardIcon className="w-4 h-4 text-emerald-400" />
              Correct: {correctCount} states
            </span>
            <span>
              Reset score above
            </span>
          </div>

        </aside>

      </main>

      {/* Footer */}
      <footer className="border-t border-slate-800 bg-slate-950 py-4 px-6 flex flex-col sm:flex-row items-center justify-between text-center sm:text-left text-xs text-slate-500 mt-auto gap-4">
        <p>© 2026 US States Explorer & Quiz Game. Fully functional client-side educational platform.</p>
        <span 
          style={{ fontFamily: '"Arial Narrow", Arial, sans-serif', fontStretch: 'condensed', letterSpacing: '0.05em' }}
          className="text-sm font-black uppercase tracking-wider text-slate-600"
        >
          WILLIAMHCHANSTUDIO
        </span>
      </footer>

      {/* Enlarged Image Modal Overlay */}
      {enlargedImage && (
        <div 
          onClick={() => setEnlargedImage(null)}
          className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-fadeIn cursor-zoom-out"
        >
          {/* Modal Card */}
          <div 
            onClick={(e) => e.stopPropagation()} 
            className="bg-slate-900/95 border border-slate-800 rounded-2xl p-6 max-w-3xl w-full flex flex-col items-center gap-4 shadow-2xl relative cursor-default"
          >
            {/* Close button */}
            <button 
              onClick={() => setEnlargedImage(null)}
              className="absolute top-4 right-4 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white p-1.5 rounded-lg border border-slate-700/50 transition-all"
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>

            <h4 className="text-lg font-black text-white tracking-tight mr-8">{enlargedImage.title}</h4>
            
            <div className="bg-slate-950/40 border border-slate-800/80 rounded-xl p-4 w-full h-[60vh] flex items-center justify-center overflow-hidden">
              <img 
                src={enlargedImage.url} 
                alt={enlargedImage.title} 
                className="max-w-full max-h-full object-contain animate-fadeIn"
                referrerPolicy="no-referrer"
              />
            </div>

            <button 
              onClick={() => setEnlargedImage(null)}
              className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-xl border border-slate-700/60 font-semibold text-xs transition-all shadow-md"
            >
              Close Overlay
            </button>
          </div>
        </div>
      )}

    </div>
  );
}


    // --- Render App ---
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<React.StrictMode><App /></React.StrictMode>);
  </script>
</body>
</html>
